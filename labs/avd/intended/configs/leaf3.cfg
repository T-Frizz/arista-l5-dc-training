!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$l5dclab$cwiMlFNjjy0j7eQHiLqDJ3rJvYfxOBjnzm09/nIikVP.PSci6HEuauTE9TRoA4lRamjbC6XG1tzIbAlS4K81e0
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf3
ip name-server vrf default 1.1.1.1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 16384
!
vlan 10
   name APP
!
vlan 20
   name DB
!
vlan 30
   name L2_STRETCH
!
vlan 3001
   name MLAG_L3_VRF_TENANT-A
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance TENANT-A
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
management api gnmi
   transport grpc default
!
interface Port-Channel5
   description SERVER_host2
   no shutdown
   switchport trunk allowed vlan 10,20,30
   switchport mode trunk
   switchport
   mlag 5
!
interface Port-Channel10
   description MLAG_leaf4_Port-Channel10
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description P2P_spine1_Ethernet3
   no shutdown
   mtu 1500
   no switchport
   ip address 10.255.255.9/31
!
interface Ethernet2
   description P2P_spine2_Ethernet3
   no shutdown
   mtu 1500
   no switchport
   ip address 10.255.255.11/31
!
interface Ethernet3
   description MLAG_leaf4_Ethernet3
   no shutdown
   channel-group 10 mode active
!
interface Ethernet4
   description MLAG_leaf4_Ethernet4
   no shutdown
   channel-group 10 mode active
!
interface Ethernet5
   description SERVER_host2_Ethernet1
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description P2P_core1
   no shutdown
   no switchport
   vrf TENANT-A
   ip address 10.255.254.0/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.5/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.1.5/32
!
interface Loopback100
   description DIAG_VRF_TENANT-A
   no shutdown
   vrf TENANT-A
   ip address 10.255.10.5/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 172.100.100.23/24
!
interface Vlan10
   description APP
   no shutdown
   vrf TENANT-A
   ip address virtual 10.10.10.1/24
!
interface Vlan20
   description DB
   no shutdown
   vrf TENANT-A
   ip address virtual 10.20.20.1/24
!
interface Vlan3001
   description MLAG_L3_VRF_TENANT-A
   no shutdown
   mtu 1500
   vrf TENANT-A
   ip address 10.255.251.4/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.255.251.4/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.255.252.4/31
!
interface Vxlan1
   description leaf3_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vrf TENANT-A vni 50001
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip address virtual source-nat vrf TENANT-A address 10.255.10.5
!
ip routing
ip routing vrf TENANT-A
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/27 eq 32
   seq 20 permit 10.255.1.0/27 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.251.4/31
!
mlag configuration
   domain-id POD_B
   local-interface Vlan4094
   peer-address 10.255.252.5
   peer-link Port-Channel10
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route 0.0.0.0/0 172.100.100.1
!
ntp local-interface Management0
ntp server 0.pool.ntp.org prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65102
   router-id 10.255.0.5
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65102
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description leaf4
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 remote-as 65100
   neighbor 10.255.0.1 description spine1_Loopback0
   neighbor 10.255.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.2 remote-as 65100
   neighbor 10.255.0.2 description spine2_Loopback0
   neighbor 10.255.251.5 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.255.251.5 description leaf4_Vlan4093
   neighbor 10.255.255.8 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.8 remote-as 65100
   neighbor 10.255.255.8 description spine1_Ethernet3
   neighbor 10.255.255.10 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.255.10 remote-as 65100
   neighbor 10.255.255.10 description spine2_Ethernet3
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.255.0.5:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.255.0.5:10020
      route-target both 10020:10020
      redistribute learned
   !
   vlan 30
      rd 10.255.0.5:10030
      route-target both 10030:10030
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf TENANT-A
      rd 10.255.0.5:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.255.0.5
      neighbor 10.255.251.5 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.255.251.5 description leaf4_Vlan3001
      neighbor 10.255.254.1 remote-as 65000
      neighbor 10.255.254.1 description core1
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      !
      address-family ipv4
         neighbor 10.255.254.1 activate
!
end
