anta.tests.configuration:
- VerifyRunningConfigDiffs:
    filters:
      tags:
      - spine1
    result_overwrite:
      custom_field: Generated by AVD
- VerifyZeroTouch:
    filters:
      tags:
      - spine1
    result_overwrite:
      custom_field: Generated by AVD
anta.tests.connectivity:
- VerifyLLDPNeighbors:
    filters:
      tags:
      - spine1
    neighbors:
    - neighbor_device: leaf1
      neighbor_port: Ethernet1
      port: Ethernet1
    - neighbor_device: leaf2
      neighbor_port: Ethernet1
      port: Ethernet2
    - neighbor_device: leaf3
      neighbor_port: Ethernet1
      port: Ethernet3
    - neighbor_device: leaf4
      neighbor_port: Ethernet1
      port: Ethernet4
    require_fqdn: false
    result_overwrite:
      custom_field: Generated by AVD
- VerifyReachability:
    filters:
      tags:
      - spine1
    hosts:
    - description: leaf1_Ethernet1
      destination: 10.255.255.1
      repeat: 1
      source: 10.255.255.0
      vrf: default
    - description: leaf2_Ethernet1
      destination: 10.255.255.5
      repeat: 1
      source: 10.255.255.4
      vrf: default
    - description: leaf3_Ethernet1
      destination: 10.255.255.9
      repeat: 1
      source: 10.255.255.8
      vrf: default
    - description: leaf4_Ethernet1
      destination: 10.255.255.13
      repeat: 1
      source: 10.255.255.12
      vrf: default
    result_overwrite:
      custom_field: Generated by AVD
      description: Verifies point-to-point reachability between Ethernet interfaces.
