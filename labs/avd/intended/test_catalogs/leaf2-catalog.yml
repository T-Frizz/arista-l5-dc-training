anta.tests.configuration:
- VerifyRunningConfigDiffs:
    filters:
      tags:
      - leaf2
    result_overwrite:
      custom_field: Generated by AVD
- VerifyZeroTouch:
    filters:
      tags:
      - leaf2
    result_overwrite:
      custom_field: Generated by AVD
anta.tests.connectivity:
- VerifyLLDPNeighbors:
    filters:
      tags:
      - leaf2
    neighbors:
    - neighbor_device: spine1
      neighbor_port: Ethernet2
      port: Ethernet1
    - neighbor_device: spine2
      neighbor_port: Ethernet2
      port: Ethernet2
    - neighbor_device: leaf1
      neighbor_port: Ethernet3
      port: Ethernet3
    - neighbor_device: leaf1
      neighbor_port: Ethernet4
      port: Ethernet4
    require_fqdn: false
    result_overwrite:
      custom_field: Generated by AVD
- VerifyReachability:
    filters:
      tags:
      - leaf2
    hosts:
    - description: spine1_Ethernet2
      destination: 10.255.255.4
      repeat: 1
      source: 10.255.255.5
      vrf: default
    - description: spine2_Ethernet2
      destination: 10.255.255.6
      repeat: 1
      source: 10.255.255.7
      vrf: default
    result_overwrite:
      custom_field: Generated by AVD
      description: Verifies point-to-point reachability between Ethernet interfaces.
