aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_leaf4_Ethernet3
  shutdown: false
  channel_group:
    id: 10
    mode: active
  metadata:
    peer: leaf4
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_leaf4_Ethernet4
  shutdown: false
  channel_group:
    id: 10
    mode: active
  metadata:
    peer: leaf4
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: P2P_spine1_Ethernet3
  shutdown: false
  mtu: 1500
  ip_address: 10.255.255.9/31
  metadata:
    peer: spine1
    peer_interface: Ethernet3
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_spine2_Ethernet3
  shutdown: false
  mtu: 1500
  ip_address: 10.255.255.11/31
  metadata:
    peer: spine2
    peer_interface: Ethernet3
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_core1
  shutdown: false
  vrf: TENANT-A
  ip_address: 10.255.254.0/31
  metadata:
    peer_type: l3_interface
  switchport:
    enabled: false
- name: Ethernet5
  description: SERVER_host2_Ethernet1
  shutdown: false
  channel_group:
    id: 5
    mode: active
  metadata:
    peer: host2
    peer_interface: Ethernet1
    peer_type: server
    peer_key: servers
hostname: leaf3
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: default
    servers:
    - ip_address: 1.1.1.1
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:01
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$l5dclab$cwiMlFNjjy0j7eQHiLqDJ3rJvYfxOBjnzm09/nIikVP.PSci6HEuauTE9TRoA4lRamjbC6XG1tzIbAlS4K81e0
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.5/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.5/32
- name: Loopback100
  description: DIAG_VRF_TENANT-A
  shutdown: false
  vrf: TENANT-A
  ip_address: 10.255.10.5/32
management_api_gnmi:
  transport:
    grpc:
    - name: default
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 172.100.100.23/24
  type: oob
  gateway: 172.100.100.1
metadata:
  is_deployed: true
  platform: cEOS
  fabric_name: L5DC_FABRIC
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: POD_B
  local_interface: Vlan4094
  peer_address: 10.255.252.5
  peer_link: Port-Channel10
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management0
    vrf: default
  servers:
  - name: 0.pool.ntp.org
    preferred: true
  vrf: default
port_channel_interfaces:
- name: Port-Channel10
  description: MLAG_leaf4_Port-Channel10
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel5
  description: SERVER_host2
  shutdown: false
  mlag: 5
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 10,20,30
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/27 eq 32
  - sequence: 20
    action: permit 10.255.1.0/27 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.251.4/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines
      to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65102'
  router_id: 10.255.0.5
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65102'
    description: leaf4
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.251.5
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: leaf4
    description: leaf4_Vlan4093
  - ip_address: 10.255.255.8
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine1
    description: spine1_Ethernet3
  - ip_address: 10.255.255.10
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine2
    description: spine2_Ethernet3
  - ip_address: 10.255.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine1
    description: spine1_Loopback0
  - ip_address: 10.255.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: spine2
    description: spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 10
    metadata:
      tenants:
      - TENANT_A
    rd: 10.255.0.5:10010
    route_targets:
      both:
      - 10010:10010
    redistribute_routes:
    - learned
  - id: 20
    metadata:
      tenants:
      - TENANT_A
    rd: 10.255.0.5:10020
    route_targets:
      both:
      - 10020:10020
    redistribute_routes:
    - learned
  - id: 30
    metadata:
      tenants:
      - TENANT_A
    rd: 10.255.0.5:10030
    route_targets:
      both:
      - 10030:10030
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: TENANT-A
    rd: 10.255.0.5:50001
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 50001:50001
      export:
      - address_family: evpn
        route_targets:
        - 50001:50001
    router_id: 10.255.0.5
    neighbors:
    - ip_address: 10.255.251.5
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: leaf4_Vlan3001
    - ip_address: 10.255.254.1
      remote_as: '65000'
      description: core1
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
    address_family_ipv4:
      neighbors:
      - ip_address: 10.255.254.1
        activate: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 16384
  no_spanning_tree_vlan: 4093-4094
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 172.100.100.1
transceiver_qsfp_default_mode_4x10: true
virtual_source_nat_vrfs:
- name: TENANT-A
  ip_address: 10.255.10.5
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.255.251.4/31
  mtu: 1500
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.252.4/31
  mtu: 1500
  no_autostate: true
- name: Vlan10
  description: APP
  shutdown: false
  vrf: TENANT-A
  ip_address_virtual: 10.10.10.1/24
  metadata:
    tenants:
    - TENANT_A
- name: Vlan20
  description: DB
  shutdown: false
  vrf: TENANT-A
  ip_address_virtual: 10.20.20.1/24
  metadata:
    tenants:
    - TENANT_A
- name: Vlan3001
  description: MLAG_L3_VRF_TENANT-A
  shutdown: false
  vrf: TENANT-A
  ip_address: 10.255.251.4/31
  mtu: 1500
  metadata:
    tenants:
    - TENANT_A
    type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 10
  name: APP
  metadata:
    tenants:
    - TENANT_A
- id: 20
  name: DB
  metadata:
    tenants:
    - TENANT_A
- id: 3001
  name: MLAG_L3_VRF_TENANT-A
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - TENANT_A
- id: 30
  name: L2_STRETCH
  metadata:
    tenants:
    - TENANT_A
vrfs:
- name: default
  ip_routing: false
- name: TENANT-A
  ip_routing: true
  metadata:
    tenants:
    - TENANT_A
vxlan_interface:
  vxlan1:
    description: leaf3_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
      vlans:
      - id: 10
        vni: 10010
      - id: 20
        vni: 10020
      - id: 30
        vni: 10030
      vrfs:
      - name: TENANT-A
        vni: 50001
