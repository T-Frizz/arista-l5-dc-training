---
# Fabric topology: 2 spines, two MLAG leaf pairs (eBGP underlay, EVPN overlay).
# Values match the addressing plan in labs/lab-guide.html.
underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp
evpn_vlan_aware_bundles: false

spine:
  defaults:
    platform: cEOS
    mgmt_interface: Management0
    loopback_ipv4_pool: 10.255.0.0/27
    bgp_as: 65100
    structured_config: &mgmt_apis
      management_api_http:
        enable_https: true
        enable_vrfs:
          - name: default
      management_api_gnmi:
        transport:
          grpc:
            - name: default
  nodes:
    - name: spine1
      id: 1
      mgmt_ip: 172.100.100.11/24
    - name: spine2
      id: 2
      mgmt_ip: 172.100.100.12/24

l3leaf:
  defaults:
    platform: cEOS
    mgmt_interface: Management0
    loopback_ipv4_pool: 10.255.0.0/27
    loopback_ipv4_offset: 2
    vtep_loopback_ipv4_pool: 10.255.1.0/27
    uplink_interfaces: [Ethernet1, Ethernet2]
    uplink_switches: [spine1, spine2]
    uplink_ipv4_pool: 10.255.255.0/26
    mlag_interfaces: [Ethernet3, Ethernet4]
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    mlag_port_channel_id: 10
    structured_config: *mgmt_apis
    virtual_router_mac_address: 00:1c:73:00:dc:01
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
  node_groups:
    - group: POD_A
      bgp_as: 65101
      nodes:
        - name: leaf1
          id: 1
          mgmt_ip: 172.100.100.21/24
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: leaf2
          id: 2
          mgmt_ip: 172.100.100.22/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
    - group: POD_B
      bgp_as: 65102
      nodes:
        - name: leaf3
          id: 3
          mgmt_ip: 172.100.100.23/24
          uplink_switch_interfaces: [Ethernet3, Ethernet3]
        - name: leaf4
          id: 4
          mgmt_ip: 172.100.100.24/24
          uplink_switch_interfaces: [Ethernet4, Ethernet4]
