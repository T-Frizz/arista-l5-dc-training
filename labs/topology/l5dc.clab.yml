# containerlab topology for the L5 Data Center lab guide (labs/lab-guide.html)
#
#   sudo containerlab deploy -t l5dc.clab.yml
#   ssh admin@172.100.100.21     (password: admin)
#
# Needs a cEOS-lab image imported as ceos:4.34.2F (free download from
# arista.com > Software Downloads > cEOS-lab; any 4.32+ release works,
# just change the image tag below). About 10-12 GB RAM for all 9 nodes.
name: l5dc

mgmt:
  network: l5dc-mgmt
  ipv4-subnet: 172.100.100.0/24

topology:
  kinds:
    ceos:
      image: ceos:4.34.2F
  nodes:
    spine1: {kind: ceos, mgmt-ipv4: 172.100.100.11, startup-config: startup/spine1.cfg}
    spine2: {kind: ceos, mgmt-ipv4: 172.100.100.12, startup-config: startup/spine2.cfg}
    leaf1:  {kind: ceos, mgmt-ipv4: 172.100.100.21, startup-config: startup/leaf1.cfg}
    leaf2:  {kind: ceos, mgmt-ipv4: 172.100.100.22, startup-config: startup/leaf2.cfg}
    leaf3:  {kind: ceos, mgmt-ipv4: 172.100.100.23, startup-config: startup/leaf3.cfg}
    leaf4:  {kind: ceos, mgmt-ipv4: 172.100.100.24, startup-config: startup/leaf4.cfg}
    host1:  {kind: ceos, mgmt-ipv4: 172.100.100.31, startup-config: startup/host1.cfg}
    host2:  {kind: ceos, mgmt-ipv4: 172.100.100.32, startup-config: startup/host2.cfg}
    core1:  {kind: ceos, mgmt-ipv4: 172.100.100.41, startup-config: startup/core1.cfg}
  links:
    # Leaf uplinks: leafN Eth1 -> spine1, Eth2 -> spine2 (spine port = leaf number)
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf3:eth2", "spine2:eth3"]
    - endpoints: ["leaf4:eth1", "spine1:eth4"]
    - endpoints: ["leaf4:eth2", "spine2:eth4"]
    # MLAG peer links (leaf Eth3-4)
    - endpoints: ["leaf1:eth3", "leaf2:eth3"]
    - endpoints: ["leaf1:eth4", "leaf2:eth4"]
    - endpoints: ["leaf3:eth3", "leaf4:eth3"]
    - endpoints: ["leaf3:eth4", "leaf4:eth4"]
    # Spine-to-spine links: used only by the L2LS lab (spine MLAG pair)
    - endpoints: ["spine1:eth5", "spine2:eth5"]
    - endpoints: ["spine1:eth6", "spine2:eth6"]
    # Dual-homed hosts (leaf Eth5)
    - endpoints: ["host1:eth1", "leaf1:eth5"]
    - endpoints: ["host1:eth2", "leaf2:eth5"]
    - endpoints: ["host2:eth1", "leaf3:eth5"]
    - endpoints: ["host2:eth2", "leaf4:eth5"]
    # External router on the border pair (leaf Eth6)
    - endpoints: ["core1:eth1", "leaf3:eth6"]
    - endpoints: ["core1:eth2", "leaf4:eth6"]
