! Day-0 startup config for a lab host (pre-built; you do not change hosts).
hostname host1
!
no aaa root
username admin privilege 15 role network-admin secret sha512 $6$l5dclab$cwiMlFNjjy0j7eQHiLqDJ3rJvYfxOBjnzm09/nIikVP.PSci6HEuauTE9TRoA4lRamjbC6XG1tzIbAlS4K81e0
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
!
interface Management0
   description OOB_MANAGEMENT
   ip address 172.100.100.31/24
!
ip route 0.0.0.0/0 172.100.100.1
!
management api http-commands
   protocol https
   no shutdown
!
management api gnmi
   transport grpc default
!
lldp run
!
! Lab host: an EOS switch acting as a dual-homed server.
! Each VLAN sits in its own VRF so one box behaves like three servers.
vrf instance H10
vrf instance H20
vrf instance H30
!
ip routing vrf H10
ip routing vrf H20
ip routing vrf H30
!
vlan 10,20,30
!
interface Port-Channel1
   description to_leaf1/leaf2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30
!
interface Ethernet1
   channel-group 1 mode active
!
interface Ethernet2
   channel-group 1 mode active
!
interface Vlan10
   vrf H10
   ip address 10.10.10.101/24
!
interface Vlan20
   vrf H20
   ip address 10.20.20.101/24
!
interface Vlan30
   vrf H30
   ip address 10.30.30.101/24
!
ip route vrf H10 0.0.0.0/0 10.10.10.1
ip route vrf H20 0.0.0.0/0 10.20.20.1
!
end
