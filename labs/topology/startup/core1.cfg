! Day-0 startup config for the external router core1 (pre-built).
hostname core1
!
no aaa root
username admin privilege 15 role network-admin secret sha512 $6$l5dclab$cwiMlFNjjy0j7eQHiLqDJ3rJvYfxOBjnzm09/nIikVP.PSci6HEuauTE9TRoA4lRamjbC6XG1tzIbAlS4K81e0
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
!
interface Management0
   description OOB_MANAGEMENT
   ip address 172.100.100.41/24
!
ip route 0.0.0.0/0 172.100.100.1
!
management api http-commands
   protocol https
   no shutdown
!
management api gnmi
   transport grpc default
!
lldp run
!
! External router (AS 65000). Represents the WAN/Internet edge.
! Brought up in capstone C2. Pre-built so the border labs only touch leaf3/leaf4.
ip routing
!
interface Ethernet1
   description P2P_leaf3_Ethernet6
   no switchport
   ip address 10.255.254.1/31
!
interface Ethernet2
   description P2P_leaf4_Ethernet6
   no switchport
   ip address 10.255.254.3/31
!
interface Loopback0
   ip address 10.255.0.100/32
!
interface Loopback1
   description INTERNET_TEST_PREFIX
   ip address 8.8.8.8/24
!
ip route 0.0.0.0/0 Null0
!
router bgp 65000
   router-id 10.255.0.100
   maximum-paths 2
   neighbor 10.255.254.0 remote-as 65102
   neighbor 10.255.254.0 description leaf3
   neighbor 10.255.254.2 remote-as 65102
   neighbor 10.255.254.2 description leaf4
   network 0.0.0.0/0
   network 8.8.8.0/24
!
end
