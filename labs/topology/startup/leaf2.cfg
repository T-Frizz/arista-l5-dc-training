! Day-0 startup config (leaf). Only management is configured.
! The labs build everything else.
hostname leaf2
!
no aaa root
username admin privilege 15 role network-admin secret sha512 $6$l5dclab$cwiMlFNjjy0j7eQHiLqDJ3rJvYfxOBjnzm09/nIikVP.PSci6HEuauTE9TRoA4lRamjbC6XG1tzIbAlS4K81e0
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
!
interface Management0
   description OOB_MANAGEMENT
   ip address 172.100.100.22/24
!
ip route 0.0.0.0/0 172.100.100.1
!
management api http-commands
   protocol https
   no shutdown
!
management api gnmi
   transport grpc default
!
lldp run
!
end
